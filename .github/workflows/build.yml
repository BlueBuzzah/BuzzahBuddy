name: Build 🏗️
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "BuzzahBuddy/**"
      - "BuzzahBuddy.Tests/**"
      - "BuzzahBuddy.Native.Binding/**"
      - "native/**"
      - ".github/workflows/build.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      # Test project compiles app sources directly (no ProjectReference),
      # so no mobile workloads are needed here
      - name: Test
        run: dotnet test BuzzahBuddy.Tests -c Release

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore Workloads
        run: dotnet workload install maui-android
      # -p:TargetFrameworks pins restore/build to the android TFM; the iOS
      # workload packs don't exist on Linux, so a full multi-TFM restore fails
      - name: Build Android
        run: dotnet build BuzzahBuddy/BuzzahBuddy.csproj -f net10.0-android -c Debug -p:TargetFrameworks=net10.0-android
      # Compile check for the plain net10.0 TFM — the only build that covers
      # BluetoothService, which the test project can't compile (Plugin.BLE
      # throws off-device). Runs here because it needs the MAUI workload.
      - name: Build net10.0 compile check
        run: dotnet build BuzzahBuddy/BuzzahBuddy.csproj -f net10.0 -c Debug -p:TargetFrameworks=net10.0

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      # The iOS workload pins an exact Xcode: the latest workload set (10.0.402.1+)
      # binds iOS 27.1 and fails with MT0180 on runners that top out at Xcode
      # 26.x. Pin both together; move them in lockstep when the runner image
      # gains a newer Xcode (`dotnet workload search version <set>` lists the
      # iOS SDK each set binds).
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Restore Workloads
        run: dotnet workload install maui-ios --version 10.0.401
      - name: Build iOS
        run: dotnet build BuzzahBuddy/BuzzahBuddy.csproj -f net10.0-ios -c Debug -p:TargetFrameworks=net10.0-ios
